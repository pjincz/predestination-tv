plugins {
    id 'com.android.application'
}

def releasePropertiesFile = rootProject.file('signing/release.properties')
def releaseProperties = new Properties()
if (releasePropertiesFile.isFile()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

android {
    namespace 'io.jcz.predestination.exo'
    compileSdk 36
    testOptions.unitTests.includeAndroidResources = true

    signingConfigs {
        release {
            if (releasePropertiesFile.isFile()) {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    defaultConfig {
        def targetAbi = providers.gradleProperty('targetAbi').orNull
        if (targetAbi != null) ndk.abiFilters.add(targetAbi)

        applicationId 'io.jcz.predestination.tv.exo'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.9.0'
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild') {
        doFirst {
            if (!releasePropertiesFile.isFile()) {
                throw new GradleException('Release signing requires signing/release.properties; see signing/README.md')
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    def media3 = '1.10.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.10.0-0.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
